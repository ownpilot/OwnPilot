# Mosquitto MQTT Broker Configuration

# =============================================================================
# Listeners
# =============================================================================

# MQTT (TCP)
listener 1883 0.0.0.0

# WebSockets
listener 9001 0.0.0.0
protocol websockets

# =============================================================================
# Persistence
# =============================================================================

persistence true
persistence_location /mosquitto/data/

# =============================================================================
# Logging
# =============================================================================

log_dest stdout
log_type error
log_type warning
log_type information
log_timestamp true

# =============================================================================
# Security
# =============================================================================

allow_anonymous false
password_file /tmp/ownpilot-mosquitto-passwd
